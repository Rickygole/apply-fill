<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; color: #1b1b1b; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  button { width: 100%; padding: 9px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; background: #2e7d32; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #out { margin-top: 10px; line-height: 1.45; }
  #out ul { margin: 4px 0 0; padding-left: 18px; color: #b45309; }
  .err { color: #b91c1c; }
  .row { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; }
  a { color: #1d4ed8; cursor: pointer; }
</style>
</head>
<body>
  <h1>Apply Fill</h1>
  <button id="fill">Fill this page</button>
  <div id="out"></div>
  <div class="row"><span>Alt+Shift+F</span><a id="opts">Edit profile</a></div>
  <script src="popup.js"></script>
</body>
</html>
