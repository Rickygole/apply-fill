<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Apply Fill profile</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; color: #1b1b1b; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #555; margin-top: 0; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #555; margin: 28px 0 8px; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: #444; }
  label.wide { grid-column: 1 / -1; }
  label.check { flex-direction: row; align-items: center; gap: 8px; font-size: 13px; color: #1b1b1b; }
  input[type=text], textarea { font: inherit; padding: 6px 8px; border: 1px solid #bbb; border-radius: 5px; }
  textarea { min-height: 70px; resize: vertical; }
  .bar { position: sticky; bottom: 0; background: #fff; padding: 12px 0; border-top: 1px solid #ddd; margin-top: 24px; display: flex; gap: 8px; align-items: center; }
  button { font: inherit; padding: 7px 14px; border-radius: 6px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
  button.primary { background: #2e7d32; color: #fff; border-color: #2e7d32; font-weight: 600; }
  #status { color: #2e7d32; margin-left: 8px; }
  #resumeName { font-size: 13px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>Apply Fill profile</h1>
  <p class="sub">Stored only in this browser. The extension fills forms and never presses submit.</p>
  <form id="form"></form>
  <h2>Resume</h2>
  <div class="grid">
    <label class="wide">PDF attached to the resume upload field
      <input type="file" id="resumeFile" accept=".pdf,.doc,.docx">
    </label>
    <div id="resumeName" class="wide"></div>
  </div>
  <div class="bar">
    <button class="primary" id="save">Save</button>
    <button id="import">Import JSON</button>
    <button id="export">Export JSON</button>
    <input type="file" id="importFile" accept=".json" hidden>
    <span id="status"></span>
  </div>
  <script src="options.js"></script>
</body>
</html>
